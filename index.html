<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leaderboard Tennis</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="script.js"></script>
  <script type="module" src="migration.js"></script>
</head>
<body>
  <div class="header">
    <img class="logo" src="logo.png" alt="logo" id="logo"/>
    <h1>Lüdesan Garros</h1>
  </div>

  <div class="container" id="mainContainer">
    <div class="tab-switch">
      <input type="radio" id="singles" name="tab" checked>
      <label for="singles" id="tab-singles" class="tab">Singolo</label>
      <input type="radio" id="doubles" name="tab">
      <label for="doubles" id="tab-doubles" class="tab">Doppio</label>
      <div class="slider"></div>
    </div>

    <div id="tableWrapper"><div id="leaderboard"></div></div>

    <div class="container-wide" style="text-align:right;margin-bottom:10px;">
</div>

<!-- Modal Passkey -->
<div class="modal-overlay" id="passkeyModal">
  <div class="modal">
    <h2>Autorizzazione</h2>
    <p>Inserire la passkey per procedere.</p>
    <input type="password" id="passkeyInput" placeholder="Passkey" required />
    <div class="button-group">
      <button id="confirmPasskey">Conferma</button>
      <button type="button" class="cancel-btn" id="cancelPasskey">Annulla</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addPlayerModal">
  <div class="modal">
    <h2>Nuovo giocatore</h2>
    <form id="addPlayerForm">
      <input type="text" id="ap_name" placeholder="Nome e cognome" required />
      <input type="text" id="ap_short" placeholder="Abbreviazione (es. M. Rossi)" />
      <input type="url" id="ap_photo" placeholder="URL foto (opzionale)" />

      <div class="line-separator"></div>
      <div class="grid-2">
        <input type="number" id="ap_dritto" min="1" max="10" value="5" placeholder="Dritto (1-10)" required />
        <input type="number" id="ap_rovescio" min="1" max="10" value="5" placeholder="Rovescio (1-10)" required />
        <input type="number" id="ap_servizio" min="1" max="10" value="5" placeholder="Servizio (1-10)" required />
        <input type="number" id="ap_volee" min="1" max="10" value="5" placeholder="Volée (1-10)" required />
        <input type="number" id="ap_stamina" min="1" max="10" value="5" placeholder="Stamina (1-10)" required />
        <input type="number" id="ap_gameplay" min="1" max="10" value="5" placeholder="Gameplay (1-10)" required />
      </div>

      <label style="display:block;margin-top:8px;">
        <input type="checkbox" id="ap_singles" checked /> Inizializza Singles
      </label>
      <label style="display:block;">
        <input type="checkbox" id="ap_doubles" /> Inizializza Doubles
      </label>

      <div class="button-group">
        <button type="submit">Salva</button>
        <button type="button" class="cancel-btn" id="closeAddPlayer">Annulla</button>
      </div>
    </form>
  </div>
</div>


    <div class="add-result"><h3>Aggiungi Risultato</h3></div>

    <div class="match-form">
      <button id="openAddPlayer" class="btn-outline">+</button>
      <div class="team" id="team1">
        <select id="player1"><option value="" selected disabled hidden>Seleziona un giocatore</option></select>
      </div>
      <div class="vs">VS</div>
      <div class="team" id="team2">
        <select id="player2"><option value="" selected disabled hidden>Seleziona un giocatore</option></select>
      </div>
      <!-- Gli altri select verranno aggiunti da JS -->
      <input id="sets" type="text" placeholder="Punteggi set es. 6-4 3-6 10-8">
      <select id="surface">
        <option value="">Superficie (facoltativa)</option>
        <option value="Terra">Terra</option>
        <option value="Cemento">Cemento</option>
        <option value="Erba">Erba</option>
      </select>
      <button id="addResultButton">Salva risultato</button>
    </div>
  </div>

  <div id="passkeyModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h2>Inserisci Passkey</h2>
      <form id="passkeyForm" onsubmit="return false;">
        <input type="password" id="passkeyInput" placeholder="Passkey">
        <div class="button-group">
          <button id="confirmPasskey" type="submit">Conferma</button>
          <button id="cancelPasskey" class="cancel-btn" type="button">Annulla</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
